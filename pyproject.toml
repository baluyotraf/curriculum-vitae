[project]
name = "curriculum-vitae"
version = "0.1.0"
description = "Render a curriculum vitae from a YAML config"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click",
    "mako",
    "markupsafe",
    "pillow",
    "pydantic",
    "pyyaml>=6.0",
    "requests",
]

[project.scripts]
cv = "cvlib.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cvlib"]
